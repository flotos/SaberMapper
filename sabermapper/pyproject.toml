[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sabermapper"
version = "0.2.0"
description = "Local Beat Saber authoring, audio analysis, corpus research and review studio"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "soundfile>=0.12", "imageio-ffmpeg>=0.5", "Pillow>=10.1"]

[project.optional-dependencies]
tidal = ["tiddl==3.4.4"]
dev = ["PyYAML>=6", "playwright>=1.50"]

[project.scripts]
sabermapper = "sabermapper.__main__:main"

[tool.setuptools.packages.find]
include = ["sabermapper*"]

[tool.setuptools.package-data]
sabermapper = ["static/*", "resources/*"]
